# 운영 서버(/opt/ashveil)용 실행 구성. host Caddy 가 https://game.maxihan.com 을 127.0.0.1:18081 로 넘긴다. deploy.sh 로 띄운다.
name: ashveil

services:
  db:
    image: postgres:16-alpine
    # 백업(Auth_platform infra/backup/ops-backup.sh 의 DBS)이 이 이름으로 찾는다
    container_name: ashveil-postgres
    environment:
      POSTGRES_DB: ashveil
      POSTGRES_USER: ashveil
      POSTGRES_PASSWORD: ${DB_PASSWORD:?.env 가 없다 — deploy.sh 로 띄운다}
    volumes:
      - db-data:/var/lib/postgresql/data
    # 포트를 열지 않는다. 게임 서버만 compose 망으로 닿는다.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ashveil -d ashveil"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 256m
    restart: unless-stopped

  server:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    container_name: ashveil-server
    environment:
      # QA 대상 서버라 GM API · 어드민 · Swagger 를 켠다(D-41)
      ASPNETCORE_ENVIRONMENT: Qa
      ConnectionStrings__Game: "Host=db;Port=5432;Database=ashveil;Username=ashveil;Password=${DB_PASSWORD:?}"
      Jwt__Key: ${JWT_KEY:?}
      Admin__Key: ${ADMIN_KEY:?}
    ports:
      - "127.0.0.1:18081:8080"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped

volumes:
  db-data:
    name: ashveil-db-data
